version: '3.8'

# WARNING: This docker-compose file is for DEVELOPMENT ONLY!
# It contains default credentials that should NOT be used in production.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: socialsave
      POSTGRES_PASSWORD: socialsave
      POSTGRES_DB: socialsave
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DB_URL: postgresql://socialsave:socialsave@postgres:5432/socialsave?sslmode=disable
      FRONTEND_URL: http://localhost:3000
      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      - backend

volumes:
  postgres_data:
